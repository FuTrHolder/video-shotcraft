name: Deploy gallery to GitHub Pages

# Publishes gallery/ to the gh-pages branch whenever it changes on main.
# Motion-preview MP4s live as assets on the `gallery-media` release (not in
# git) and are downloaded into place during assembly, so library.json's
# relative ./media/*.mp4 URLs keep working unchanged.
on:
  push:
    branches: [main]
    paths:
      - 'gallery/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p site
          rsync -a \
            --exclude 'sync-from-cards.py' \
            --exclude 'build-seo.py' \
            --exclude '__pycache__' \
            gallery/ site/
          touch site/.nojekyll

      - name: Download motion previews from the gallery-media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/media
          gh release download gallery-media \
            --repo "$GITHUB_REPOSITORY" \
            --dir site/media \
            --pattern '*.mp4' \
            --clobber

      - name: Check every library.json preview has its file
        run: |
          python3 - <<'EOF'
          import json, os, sys
          lib = json.load(open('site/api/library.json'))
          missing = []
          for card in lib['cards']:
              for style in card['styles']:
                  media = style.get('media')
                  url = media.get('url') if isinstance(media, dict) else media
                  if not url:
                      continue
                  path = os.path.join('site', url.split('?')[0].lstrip('./'))
                  if not os.path.exists(path):
                      missing.append(path)
          if missing:
              print('missing media files:', *missing, sep='\n  ')
              sys.exit(1)
          print(f'all previews present ({len(lib["cards"])} cards checked)')
          EOF

      - name: Push to gh-pages
        run: |
          cd site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy gallery from ${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
