name: Generate Blog Promotional Video

on:
  workflow_dispatch:
    inputs:
      blog_url:
        description: "Blog URL"
        required: true
        type: string

jobs:
  generate-blog-video:
    name: Generate Blog Promo
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout blog-video branch
        uses: actions/checkout@v4
        with:
          ref: blog-video

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/package.json

      - name: Install Remotion dependencies
        working-directory: template
        run: npm install

      - name: Install blog capture dependencies
        run: |
          npm init -y
          npm install puppeteer@24

      - name: Verify repository files
        run: |
          echo "=== Git ==="
          git branch --show-current
          git rev-parse HEAD
          echo ""
          echo "=== Files ==="
          test -f scripts/capture-blog.mjs
          test -f template/src/blog/BlogPromo.tsx
          test -f template/src/index.ts
          ls -lah scripts/capture-blog.mjs
          ls -lah template/src/blog/BlogPromo.tsx

      - name: Capture and analyze blog
        env:
          BLOG_URL: ${{ inputs.blog_url }}
        run: |
          node scripts/capture-blog.mjs "$BLOG_URL"

      - name: Validate blog analysis and captures
        run: |
          echo "=== Captured files ==="
          find template/public/blog -maxdepth 3 -type f -print | sort

          echo ""
          echo "=== blog.json ==="
          cat template/public/blog/blog.json

          echo ""
          echo "=== Post screenshots ==="
          find template/public/blog/posts -type f -name '*.png' -print 2>/dev/null | sort || true

          test -s template/public/blog/home.png
          test -s template/public/blog/blog.json

      - name: Render 24-second promotional video
        working-directory: template
        run: |
          rm -rf out
          mkdir -p out

          npx remotion render \
            src/index.ts \
            BlogPromo \
            out/blog-promo.mp4 \
            --concurrency=1

      - name: Verify video output
        working-directory: template
        run: |
          test -s out/blog-promo.mp4
          ls -lh out/blog-promo.mp4
          file out/blog-promo.mp4

      - name: Upload promotional video
        uses: actions/upload-artifact@v4
        with:
          name: blog-promotional-video
          path: template/out/blog-promo.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload blog analysis and captures
        uses: actions/upload-artifact@v4
        with:
          name: blog-capture
          path: template/public/blog
          if-no-files-found: error
          retention-days: 7
