name: Generate Blog Promotional Video

on:
  workflow_dispatch:
    inputs:
      blog_url:
        description: "Blog URL"
        required: true
        type: string

      blog_title:
        description: "Optional blog title"
        required: false
        type: string
        default: ""

jobs:
  generate-blog-video:
    name: Generate Blog Promo
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout blog-video branch
        uses: actions/checkout@v4
        with:
          ref: blog-video

      # ==================================================
      # NODE
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: template/package-lock.json

      # ==================================================
      # INSTALL
      # ==================================================

      - name: Install Remotion dependencies
        working-directory: template
        run: npm ci

      # ==================================================
      # VERIFY REPOSITORY
      # ==================================================

      - name: Verify repository files
        run: |
          echo "========================================"
          echo "Repository"
          echo "========================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "capture-blog.mjs:"
          test -f scripts/capture-blog.mjs
          ls -lh scripts/capture-blog.mjs

          echo ""
          echo "BlogPromo.tsx:"
          test -f template/src/blog/BlogPromo.tsx
          ls -lh template/src/blog/BlogPromo.tsx

          echo ""
          echo "BlogRoot.tsx:"
          test -f template/src/BlogRoot.tsx
          ls -lh template/src/BlogRoot.tsx

          echo ""
          echo "Workflow:"
          test -f .github/workflows/blog-video.yml
          ls -lh .github/workflows/blog-video.yml

          echo ""
          echo "Repository verification passed."

      # ==================================================
      # CAPTURE BLOG
      # ==================================================

      - name: Capture blog content
        env:
          BLOG_URL: ${{ inputs.blog_url }}
        run: |
          echo "========================================"
          echo "Capturing blog"
          echo "========================================"

          node scripts/capture-blog.mjs "$BLOG_URL"

      # ==================================================
      # CHECK CAPTURED FILES
      # ==================================================

      - name: Validate captured blog and images
        working-directory: .
        run: |
          echo "========================================"
          echo "Captured blog validation"
          echo "========================================"

          test -f template/public/blog/blog.json
          test -d template/public/blog/posts

          echo ""
          echo "Captured files:"
          find template/public/blog \
            -maxdepth 3 \
            -type f \
            -print

          echo ""
          echo "========================================"
          echo "blog.json"
          echo "========================================"

          cat template/public/blog/blog.json

          echo ""
          echo "========================================"
          echo "Image validation"
          echo "========================================"

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const jsonPath =
            "template/public/blog/blog.json";

          const data =
            JSON.parse(
              fs.readFileSync(
                jsonPath,
                "utf8",
              ),
            );

          const posts =
            Array.isArray(data.posts)
              ? data.posts
              : [];

          console.log(
            `Post count: ${posts.length}`,
          );

          if (posts.length < 5) {
            console.error(
              `ERROR: Expected at least 5 posts, found ${posts.length}`,
            );

            process.exit(1);
          }

          let realImages = 0;
          let fallbackImages = 0;

          for (
            const post of posts
          ) {
            console.log("");
            console.log(
              `Post ${post.index}: ${post.title}`,
            );

            if (
              !post.localImage
            ) {
              console.error(
                "ERROR: localImage is missing.",
              );

              process.exit(1);
            }

            const localPath =
              path.join(
                "template/public",
                post.localImage.replace(
                  /^blog\//,
                  "blog/",
                ),
              );

            console.log(
              `Image: ${post.localImage}`,
            );

            console.log(
              `Source: ${post.imageSource}`,
            );

            if (
              !fs.existsSync(
                localPath,
              )
            ) {
              console.error(
                `ERROR: Image file does not exist: ${localPath}`,
              );

              process.exit(1);
            }

            const stat =
              fs.statSync(
                localPath,
              );

            console.log(
              `Size: ${stat.size} bytes`,
            );

            if (
              stat.size < 500
            ) {
              console.error(
                `ERROR: Image file is too small: ${localPath}`,
              );

              process.exit(1);
            }

            if (
              post.imageSource ===
              "post-image"
            ) {
              realImages += 1;
            } else if (
              post.imageSource ===
              "fallback"
            ) {
              fallbackImages += 1;
            } else {
              console.error(
                `ERROR: Unknown imageSource: ${post.imageSource}`,
              );

              process.exit(1);
            }
          }

          console.log("");
          console.log(
            "========================================",
          );

          console.log(
            `Real images: ${realImages}/${posts.length}`,
          );

          console.log(
            `Fallback images: ${fallbackImages}/${posts.length}`,
          );

          console.log(
            "========================================",
          );

          /*
           * For this blog-video workflow,
           * completely image-less blogs should
           * fail rather than silently producing
           * a video consisting entirely of fallback cards.
           */

          if (
            realImages === 0
          ) {
            console.error(
              "ERROR: No real post images were captured.",
            );

            console.error(
              "The blog capture produced only fallback images.",
            );

            process.exit(1);
          }

          if (
            fallbackImages > 0
          ) {
            console.warn(
              `WARNING: ${fallbackImages} post(s) are using fallback images.`,
            );
          }

          console.log("");
          console.log(
            "Blog capture validation passed.",
          );
          NODE

      # ==================================================
      # SHOW POST SUMMARY
      # ==================================================

      - name: Show captured post summary
        run: |
          echo "========================================"
          echo "Post summary"
          echo "========================================"

          node <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "template/public/blog/blog.json",
                "utf8",
              ),
            );

          console.log(
            `Site: ${data.siteTitle}`,
          );

          console.log(
            `Identity: ${data.analysis?.identity || ""}`,
          );

          console.log(
            `Topics: ${(data.analysis?.topics || []).join(", ")}`,
          );

          console.log("");

          for (
            const post of data.posts
          ) {
            console.log(
              `${post.index}. ${post.title}`,
            );

            console.log(
              `   Image: ${post.localImage}`,
            );

            console.log(
              `   Source: ${post.imageSource}`,
            );

            console.log(
              `   Categories: ${(post.categories || []).join(", ")}`,
            );
          }
          NODE

      # ==================================================
      # RENDER
      # ==================================================

      - name: Render blog promotional video
        working-directory: template
        env:
          BLOG_TITLE: ${{ inputs.blog_title }}
          BLOG_URL: ${{ inputs.blog_url }}
        run: |
          echo "========================================"
          echo "Rendering BlogPromo"
          echo "========================================"

          rm -rf out

          mkdir -p out

          npx remotion render \
            src/index.ts \
            BlogPromo \
            out/blog-promo.mp4 \
            --concurrency=1

      # ==================================================
      # CHECK VIDEO
      # ==================================================

      - name: Check video output
        working-directory: template
        run: |
          echo "========================================"
          echo "Video output"
          echo "========================================"

          test -f out/blog-promo.mp4

          ls -lh out/blog-promo.mp4

          FILE_SIZE=$(stat -c%s out/blog-promo.mp4)

          echo ""
          echo "Video size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "ERROR: Video file is unexpectedly small."
            exit 1
          fi

          echo ""
          echo "Video render completed successfully."

      # ==================================================
      # UPLOAD MP4
      # ==================================================

      - name: Upload promotional video
        uses: actions/upload-artifact@v4
        with:
          name: blog-promotional-video
          path: template/out/blog-promo.mp4
          if-no-files-found: error

      # ==================================================
      # UPLOAD BLOG DATA
      # ==================================================

      - name: Upload captured blog assets
        uses: actions/upload-artifact@v4
        with:
          name: blog-capture
          path: template/public/blog/
          if-no-files-found: error
