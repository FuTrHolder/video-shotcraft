name: Generate Blog Promotional Video

on:
  workflow_dispatch:
    inputs:
      blog_url:
        description: "Blog URL"
        required: true
        type: string

jobs:
  generate-blog-video:
    name: Generate Blog Promo
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout blog-video branch
        uses: actions/checkout@v4
        with:
          ref: blog-video

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: template/package.json

      - name: Install Remotion dependencies
        working-directory: template
        run: npm install

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          echo "=== ImageMagick ==="
          magick --version

      - name: Verify repository files
        run: |
          echo "=== Git ==="
          git branch --show-current
          git rev-parse HEAD
          echo ""
          echo "=== Files ==="
          test -f scripts/capture-blog.mjs
          test -f template/src/blog/BlogPromo.tsx
          test -f template/src/index.ts
          ls -lah scripts/capture-blog.mjs
          ls -lah template/src/blog/BlogPromo.tsx

      - name: Capture and analyze blog
        env:
          BLOG_URL: ${{ inputs.blog_url }}
        run: |
          node scripts/capture-blog.mjs "$BLOG_URL"

      - name: Validate blog analysis and captures
        run: |
          echo "=== Captured files ==="
          find template/public/blog -maxdepth 3 -type f -print | sort

          echo ""
          echo "=== blog.json ==="
          cat template/public/blog/blog.json

          test -s template/public/blog/blog.json
          test -d template/public/blog/images

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";

          const data = JSON.parse(
            fs.readFileSync("template/public/blog/blog.json", "utf8")
          );

          const posts = (data.posts || []).slice(0, 5);

          if (posts.length !== 5) {
            throw new Error(`Expected 5 posts, got ${posts.length}`);
          }

          const hashes = [];

          for (let i = 0; i < posts.length; i++) {
            const post = posts[i];

            if (!post.title || !post.url || !post.localImage) {
              throw new Error(
                `Post ${i + 1} is missing title, url, or localImage`
              );
            }

            if (/^data:/i.test(post.localImage)) {
              throw new Error(
                `Post ${i + 1} contains a data URI instead of a local image`
              );
            }

            const file = `template/public/${post.localImage}`;

            if (!fs.existsSync(file)) {
              throw new Error(`Missing image file: ${file}`);
            }

            const buf = fs.readFileSync(file);

            if (buf.length < 5000) {
              throw new Error(`Image too small: ${file}`);
            }

            hashes.push(
              crypto
                .createHash("sha256")
                .update(buf)
                .digest("hex")
            );
          }

          const unique = new Set(hashes).size;

          console.log(`Real images: ${posts.length}/${posts.length}`);
          console.log(`Unique images: ${unique}/${posts.length}`);

          if (unique < posts.length) {
            throw new Error("Post images are duplicated");
          }
          NODE

      - name: Render 24-second promotional video
        working-directory: template
        run: |
          rm -rf out
          mkdir -p out

          npx remotion render \
            src/index.ts \
            BlogPromo \
            out/blog-promo.mp4 \
            --concurrency=1

      - name: Verify video output
        working-directory: template
        run: |
          test -s out/blog-promo.mp4
          ls -lh out/blog-promo.mp4
          file out/blog-promo.mp4

      - name: Upload promotional video
        uses: actions/upload-artifact@v4
        with:
          name: blog-promotional-video
          path: template/out/blog-promo.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload blog analysis and captures
        uses: actions/upload-artifact@v4
        with:
          name: blog-capture
          path: template/public/blog
          if-no-files-found: error
          retention-days: 7
