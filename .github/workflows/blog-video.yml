name: Generate Blog Promotional Video
 
on:
  workflow_dispatch:
    inputs:
      blog_url:
        description: "Blog URL"
        required: true
        type: string

      blog_title:
        description: "Optional blog title"
        required: false
        type: string
        default: ""

jobs:
  generate-blog-video:
    name: Generate Blog Promo
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout blog-video branch
        uses: actions/checkout@v4
        with:
          ref: blog-video

      # ------------------------------------------------------------
      # 2. Node.js
      # ------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: template/package.json

      # ------------------------------------------------------------
      # 3. Install template dependencies
      # ------------------------------------------------------------
      - name: Install Remotion dependencies
        working-directory: template
        run: npm install

      # ------------------------------------------------------------
      # 4. Install Puppeteer
      # ------------------------------------------------------------
      - name: Install blog capture dependencies
        run: |
          npm init -y
          npm install puppeteer@24

      # ------------------------------------------------------------
      # 5. Capture blog
      # ------------------------------------------------------------
      - name: Capture blog homepage
        env:
          BLOG_URL: ${{ inputs.blog_url }}
        run: |
          node scripts/capture-blog.mjs "$BLOG_URL"

      # ------------------------------------------------------------
      # 6. Validate captured asset
      # ------------------------------------------------------------
      - name: Check captured assets
        run: |
          ls -lah template/public/blog
          test -f template/public/blog/home.png

      # ------------------------------------------------------------
      # 7. Render Remotion video
      # ------------------------------------------------------------
      - name: Render blog promotional video
        working-directory: template
        env:
          BLOG_TITLE: ${{ inputs.blog_title }}
          BLOG_URL: ${{ inputs.blog_url }}
        run: |
          mkdir -p out
          npx remotion render \
            src/index.ts \
            BlogPromo \
            out/blog-promo.mp4 \
            --concurrency=1

      # ------------------------------------------------------------
      # 8. Check output
      # ------------------------------------------------------------
      - name: Check video output
        working-directory: template
        run: |
          ls -lh out/blog-promo.mp4
          test -f out/blog-promo.mp4

      # ------------------------------------------------------------
      # 9. Upload MP4
      # ------------------------------------------------------------
      - name: Upload promotional video
        uses: actions/upload-artifact@v4
        with:
          name: blog-promotional-video
          path: template/out/blog-promo.mp4
          if-no-files-found: error

      # ------------------------------------------------------------
      # 10. Upload screenshot for debugging
      # ------------------------------------------------------------
      - name: Upload captured blog screenshot
        uses: actions/upload-artifact@v4
        with:
          name: blog-capture
          path: template/public/blog/home.png
          if-no-files-found: error
