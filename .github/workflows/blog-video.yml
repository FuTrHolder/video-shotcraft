name: Generate Blog Promotional Video

on:
  workflow_dispatch:
    inputs:
      blog_url:
        description: "Blog URL"
        required: true
        type: string

      blog_title:
        description: "Optional blog title"
        required: false
        type: string
        default: ""

jobs:
  generate-blog-video:
    name: Generate Blog Promo
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout blog-video branch
        uses: actions/checkout@v4
        with:
          ref: blog-video

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: template/package.json

      - name: Install Remotion dependencies
        working-directory: template
        run: npm install

      - name: Install blog capture dependencies
        run: |
          npm init -y
          npm install puppeteer@24

      - name: Debug capture script
        run: |
          echo "Commit:"
          git rev-parse HEAD
      
          echo "Branch:"
          git branch --show-current
      
          echo "capture-blog.mjs:"
          sed -n '1,40p' scripts/capture-blog.mjs
          

      - name: Verify repository files
        run: |
          echo "Current branch/ref:"
          git branch --show-current
          git rev-parse HEAD

          echo ""
          echo "Repository root:"
          pwd

          echo ""
          echo "capture-blog.mjs:"
          ls -lah scripts/capture-blog.mjs

          echo ""
          echo "BlogPromo:"
          ls -lah template/src/blog/BlogPromo.tsx

          echo ""
          echo "BlogRoot:"
          ls -lah template/src/BlogRoot.tsx

      - name: Capture blog homepage
        env:
          BLOG_URL: ${{ inputs.blog_url }}
        run: |
          node scripts/capture-blog.mjs "$BLOG_URL"

      - name: Check captured assets
        run: |
          echo "=== Blog capture directory ==="
          find template/public/blog -maxdepth 3 -type f -print
      
          echo ""
          echo "=== Blog directory ==="
          ls -lah template/public/blog
      
          echo ""
          echo "=== Posts directory ==="
          if [ -d template/public/blog/posts ]; then
            ls -lah template/public/blog/posts
          else
            echo "posts directory does not exist"
          fi
      
          echo ""
          echo "=== blog.json ==="
          cat template/public/blog/blog.json
      
          echo ""
          echo "=== Required files ==="
          test -f template/public/blog/home.png
          test -f template/public/blog/blog.json

      - name: Render blog promotional video
        working-directory: template
        env:
          BLOG_TITLE: ${{ inputs.blog_title }}
          BLOG_URL: ${{ inputs.blog_url }}
        run: |
          mkdir -p out
      
          npx remotion render \
            src/index.tsx \
            BlogPromo \
            out/blog-promo.mp4 \
            --concurrency=1

      - name: Check video output
        working-directory: template
        run: |
          ls -lh out/blog-promo.mp4
          test -f out/blog-promo.mp4

      - name: Upload promotional video
        uses: actions/upload-artifact@v4
        with:
          name: blog-promotional-video
          path: template/out/blog-promo.mp4
          if-no-files-found: error

      - name: Upload captured blog screenshot
        uses: actions/upload-artifact@v4
        with:
          name: blog-capture
          path: template/public/blog
          if-no-files-found: error
